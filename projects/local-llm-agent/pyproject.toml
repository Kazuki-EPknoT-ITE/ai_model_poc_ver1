# uv workspace root (virtual: no [project] here)
[tool.uv.workspace]
members = ["packages/protocol/python", "eval/mock-gateway", "tools/office", "server/gateway", "server/web-relay", "server/ocr", "server/rag", "ml/training"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "datamodel-code-generator>=0.26",
  "types-PyYAML",
  "types-jsonschema",
  "reportlab>=4.2",
  "anyio>=4.4",
]

[tool.ruff]
line-length = 110
extend-exclude = ["**/generated/**"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert は pytest で使う
  "E501",  # 行の長さは formatter に任せる（日本語は全角幅で数えられるため）
]

[tool.ruff.lint.per-file-ignores]
# 配布物を作るスクリプト: 固定の引数でビルドツールを呼び、公式の URL から取得する
"apps/desktop/scripts/*.py" = ["S602", "S603", "S607", "S310"]
"tools/office/packaging/*.py" = ["S603", "S607"]
# デプロイ用スクリプトの試験: 固定のスクリプトを bash で実行する
"server/deploy/tests/*.py" = ["S603"]
"**/generated/*.py" = ["E", "UP", "I", "S", "B"]

[tool.ruff.lint.isort]
known-first-party = ["lla_protocol", "mock_gateway", "office_tools", "llm_gateway", "web_relay", "llm_ocr", "llm_rag", "lla_train"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["generated/"]

[tool.pytest.ini_options]
testpaths = [
  "packages/protocol/python/tests",
  "eval/mock-gateway/tests",
  "tools/office/tests",
  "server/gateway/tests",
  "server/web-relay/tests",
  "server/ocr/tests",
  "server/rag/tests",
  "eval/harness/tests",
  "server/deploy/tests",
  "ml/training/tests",
]
# 評価ハーネスの Python 側（lla_eval）はパッケージにせず、PYTHONPATH で読む（eval/harness/src/env.ts と同じ）
pythonpath = ["eval/harness"]
