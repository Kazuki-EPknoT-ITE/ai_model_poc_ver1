[project]
name = "web-relay"
version = "0.1.0"
description = "local-llm-agent Web Relay: search/fetch with DLP, SSRF guard, read-only fetch, extraction, quota, audit (NET-01..13)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "httpcore>=1.0",
  "anyio>=4.4",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
# HTML の本文抽出を Trafilatura で行う（無い場合は自前の簡易抽出にフォールバック）
extract = ["trafilatura>=1.12"]

[project.scripts]
web-relay = "web_relay.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_relay"]
