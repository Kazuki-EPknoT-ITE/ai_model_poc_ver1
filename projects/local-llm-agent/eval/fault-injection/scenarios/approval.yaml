# FI-19: フォルダ外への書き込み2件（承認待ち）の間も、承認の要らない手順が進む。承認後に完了する
name: fi-approval
config: { context_budget: 32768, models: [local-12b] }
steps:
  - match: { step_index: 0 }
    action: { type: tool_call, tool: fs.copy, args: { src: "a.txt", dst: "../outside/x1.txt" } }
  - match: { step_index: 1 }
    action: { type: tool_call, tool: fs.copy, args: { src: "a.txt", dst: "../outside/x2.txt" } }
  - match: { step_index: 2 }
    action: { type: tool_call, tool: fs.mkdir, args: { path: "progress" } }
  - match: { step_index: 3 }
    action: { type: final, summary: "途中", outputs: [], failures: [], needs_review: [] }
  - match: { last_user: "承認 ap-[0-9]+ が承認され" }
    repeat: true
    action: { type: final, summary: "コピーしました。", outputs: [], failures: [], needs_review: [] }
fallback:
  action: { type: final, summary: "コピーしました。", outputs: [], failures: [], needs_review: [] }
