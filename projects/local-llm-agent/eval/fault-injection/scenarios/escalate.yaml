# FI-04: 同じ操作の繰り返し → 立て直し → 26B に昇格 → 解消して完了（本番構成。昇格先 local-26b がある）
name: fi-escalate
config: { context_budget: 32768, models: [local-12b, local-26b] }
steps:
  - match: { step_index: 0 }
    action: { type: plan_update, plan: [{ id: t1, title: 確認, status: doing }] }
  - match: { purpose: agent }
    repeat: 6
    action: { type: tool_call, tool: fs.stat, args: { path: "a.txt" } }
  - match: { purpose: agent }
    action: { type: final, summary: "昇格後に完了", outputs: [], failures: [], needs_review: [] }
