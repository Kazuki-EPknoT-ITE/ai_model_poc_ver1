# 繰り返しへの守り: 同じ失敗の繰り返しは3回目から実行しない・同じ操作の承認依頼は1つだけ・質問は一度に1つ
name: rt-repeat-guard
config: { context_budget: 32768, models: [local-12b] }
steps:
  - match: { step_index: 0 }
    action: { type: plan_update, plan: [{ id: t1, title: 確認, status: doing }] }
  - match: { step_index: 1 }
    action: { type: tool_call, tool: fs.read_text, args: { path: "memo.txt:secret" } }
  - match: { step_index: 2 }
    action: { type: tool_call, tool: fs.read_text, args: { path: "memo.txt:secret" } }
  - match: { step_index: 3 }
    action: { type: tool_call, tool: fs.read_text, args: { path: "memo.txt:secret" } }
  - match: { step_index: 4 }
    action: { type: tool_call, tool: fs.copy, args: { src: "memo.txt", dst: "../outside/m.txt" } }
  - match: { step_index: 5 }
    action: { type: tool_call, tool: fs.copy, args: { src: "memo.txt", dst: "../outside/m.txt" } }
  - match: { step_index: 6 }
    action: { type: ask_user, question: "どちらのメモですか？" }
  - match: { step_index: 7 }
    action: { type: ask_user, question: "どちらのメモですか？（再）" }
  - match: { step_index: 8 }
    action: { type: final, summary: "待っています", outputs: [], failures: [], needs_review: [] }
  - match: { purpose: agent }
    action: { type: final, summary: "終了", outputs: [], failures: [], needs_review: [] }
fallback:
  action: { type: final, summary: "終了", outputs: [], failures: [], needs_review: [] }
