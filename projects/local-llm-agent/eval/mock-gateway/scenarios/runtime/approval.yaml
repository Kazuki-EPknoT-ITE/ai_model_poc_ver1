# 承認待ちでも他の手順を進め、承認後に実行される（I-08）
name: rt-approval
config: { context_budget: 32768, models: [local-12b] }
steps:
  - match: { step_index: 0 }
    action: { type: plan_update, plan: [{ id: t1, title: 外へコピー, status: doing }] }
  - match: { step_index: 1 }
    action: { type: tool_call, tool: fs.copy, args: { src: "a.txt", dst: "../outside/a-copy.txt" } }
  - match: { step_index: 2 }
    action: { type: tool_call, tool: fs.mkdir, args: { path: "out" } }
  - match: { step_index: 3 }
    action: { type: final, summary: "途中", outputs: [], failures: [], needs_review: [] }
  - match: { last_user: "承認 ap-[0-9]+ が承認され" }
    action: { type: final, summary: "コピーしました。", outputs: [], failures: [], needs_review: [] }
fallback:
  action: { type: final, summary: "（モック）想定外", outputs: [], failures: [], needs_review: [] }
