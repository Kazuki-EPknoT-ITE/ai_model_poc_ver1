# rag / web（サーバー経由。local_llm_protocol.md §3.8）
tools:
  rag.search:
    description: 社内文書を検索する（閲覧権限で絞り込まれる。出典を返す）
    effect: read
    path_args: []
    idempotent: true
    untrusted_output: true
    timeout_ms: 30000
    priority: Should
    args:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 200 }
        top_k: { type: integer, minimum: 1, maximum: 10 }
        filters:
          type: object
          additionalProperties: false
          properties:
            path_prefix: { type: string, maxLength: 512 }
            doc_type: { type: string, maxLength: 40 }
            updated_after: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    result:
      type: object
      required: [hits]
      properties:
        hits: { type: array, items: { type: object, required: [ref, path], properties: { ref: { type: string }, path: { type: string }, location: { type: string }, score: { type: number } } } }
    examples:
      - { query: "傭船料の支払期日", top_k: 5 }
  web.search:
    description: Web を検索する（社内情報は入れない。サーバーの中継を通る）
    effect: net
    path_args: []
    idempotent: true
    untrusted_output: true
    timeout_ms: 30000
    priority: Must
    args:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 120 }
        max_results: { type: integer, minimum: 1, maximum: 10 }
        site: { type: string, pattern: "^[A-Za-z0-9.-]{1,253}$" }
    result:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { type: object, required: [rank, url], properties: { rank: { type: integer }, url: { type: string }, title_ref: { type: string }, snippet_ref: { type: string } } } }
    examples:
      - { query: "国際海事機関 2026年 規則改正", site: "imo.org" }
  web.fetch:
    description: Web ページや公開 PDF の本文を取得する（読み取り専用）
    effect: net
    path_args: []
    idempotent: true
    untrusted_output: true
    timeout_ms: 60000
    priority: Must
    args:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, pattern: "^https?://", maxLength: 2048 }
        max_chars: { type: integer, minimum: 500, maximum: 8000 }
    result:
      type: object
      required: [url, final_url, chars, truncated]
      properties:
        url: { type: string }
        final_url: { type: string }
        title_ref: { type: string }
        content_type: { type: string }
        chars: { type: integer }
        truncated: { type: boolean }
    examples:
      - { url: "https://www.mlit.go.jp/maritime/", max_chars: 8000 }
