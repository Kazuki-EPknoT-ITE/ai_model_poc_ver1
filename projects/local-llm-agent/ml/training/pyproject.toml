[project]
name = "lla-train"
version = "0.1.0"
description = "QLoRA training of tool-call examples (ml/datagen output) for local-llm-agent (design §8)"
requires-python = ">=3.12"
# 学習本体のライブラリ（unsloth / trl / peft / transformers / bitsandbytes / torch）は検証機でだけ入れる
# （requirements-gpu.txt）。ここに入れるのは、データの準備と設定の検証に使うものだけ。
dependencies = ["pyyaml>=6.0"]

[project.scripts]
lla-train = "lla_train.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lla_train"]
