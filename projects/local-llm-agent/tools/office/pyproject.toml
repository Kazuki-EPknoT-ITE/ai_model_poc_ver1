[project]
name = "office-tools"
version = "0.1.0"
description = "local-llm-agent office-tools: MCP stdio server for Word/Excel/CSV/PDF (local_llm_protocol.md §3.2-3.5)"
requires-python = ">=3.12"
# ライセンスは THIRD_PARTY_LICENSES を参照（PyMuPDF は AGPL のため使わない）
dependencies = [
  "lla-protocol",
  "mcp>=1.9,<2",
  "anyio>=4.5",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "python-docx>=1.2",
  "lxml>=5.0",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "pillow>=10.0",
  "charset-normalizer>=3.3",
]

[project.scripts]
office-tools = "office_tools.server:main"

[tool.uv.sources]
lla-protocol = { workspace = true }

[dependency-groups]
dev = [
  "reportlab>=4.0",
  "pytest-cov>=5.0",
  "lxml-stubs",
  "types-openpyxl",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/office_tools"]
